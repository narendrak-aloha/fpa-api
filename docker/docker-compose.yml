# Local stack: the app, then the stores it depends on. .env holds API keys only, so a
# missing .env line cannot change the wiring. Services list keys in the same order.
# A shell variable overrides the ${...} defaults: LOG_LEVEL=DEBUG make docker-local-run
name: dev

# Same timing in every healthcheck.
x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 20

services:
  fpa-dev:
    image: fpa-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fpa_app-1
    environment:
      # Service name and internal port, not the published one. db/config.py builds
      # the SQLAlchemy URL from these.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fpa
      PGDATABASE: fpa
      # Must match the clickhouse service below.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: fpa
      # See src/fpa_project/log_config.py.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LEVEL_UVICORN: ${LOG_LEVEL_UVICORN:-INFO}
      LOG_HANDLER: ${LOG_HANDLER:-console}
      # 1 skips both seeders.
      FPA_SKIP_SEED: ${FPA_SKIP_SEED:-0}
      # claude-code needs neither; it uses the login mounted below.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      # Host claude CLI and login, for the claude-code provider.
      - ${HOME}/.local/share/claude:/opt/claude:ro
      - ${HOME}/.claude:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fpa_postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fpa
      POSTGRES_DB: fpa
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U postgres -d fpa"]

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: fpa_clickhouse-1
    environment:
      CLICKHOUSE_PASSWORD: fpa
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "clickhouse-client --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' || exit 1"]

  # Nothing connects to it yet.
  temporal:
    image: temporalio/temporal:latest
    container_name: fpa_temporal-1
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/root/.temporal

volumes:
  clickhouse_data:
  postgres_data:
  temporal_data:
