# Local stack. .env holds API keys only. A shell variable overrides the ${...}
# defaults: LOG_LEVEL=DEBUG make docker-local-run
# Passwords are repeated per service: change one, change its pair
# (PGPASSWORD / POSTGRES_PASSWORD, and both CLICKHOUSE_PASSWORDs), then `docker compose down -v`.
name: dev

services:
  fpa-dev:
    image: fpa-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fpa_app-1
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: fpa
      PGDATABASE: fpa
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: fpa
      # See src/fpa_project/log_config.py.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LEVEL_UVICORN: ${LOG_LEVEL_UVICORN:-INFO}
      LOG_HANDLER: ${LOG_HANDLER:-console}
      # 1 skips both seeders.
      FPA_SKIP_SEED: ${FPA_SKIP_SEED:-0}
      # claude-code needs neither; it uses the login mounted below.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      # Host claude CLI and login, for the claude-code provider.
      - ${HOME}/.local/share/claude:/opt/claude:ro
      - ${HOME}/.claude:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fpa_postgres-1
    environment:
      POSTGRES_PASSWORD: fpa
      POSTGRES_DB: fpa
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fpa"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: fpa_clickhouse-1
    environment:
      CLICKHOUSE_PASSWORD: fpa
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password fpa --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Nothing connects to it yet.
  temporal:
    image: temporalio/temporal:latest
    container_name: fpa_temporal-1
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/root/.temporal

volumes:
  clickhouse_data:
  postgres_data:
  temporal_data:
