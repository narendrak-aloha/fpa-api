services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: fpa-ch
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_PASSWORD: fpa
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  temporal:
    image: temporalio/temporal:latest
    container_name: fpa-temporal
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/root/.temporal

  postgres:
    image: postgres:16-alpine
    container_name: fpa-pg
    environment:
      POSTGRES_PASSWORD: fpa
      POSTGRES_DB: fpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  clickhouse_data:
  temporal_data:
  postgres_data:
