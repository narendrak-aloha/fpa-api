[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpa-project"
version = "0.1.0"
description = "Schema-aware FinOpsExpr to ClickHouse SQL compiler"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.8.0",
    "faker>=40.39.0",
    "numpy>=2.4.6",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agno = ["agno>=1.0", "google-genai>=1.0"]
clickhouse = ["clickhouse-connect>=0.7"]
db = ["alembic>=1.16", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
