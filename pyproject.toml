[project]
name = "fpa-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0.9",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.8.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0",
    "temporalio>=1.32.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
fpa-be = "fpa_be:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# seed_fpa.py is provided/frozen (see docs/DATA_MODEL.md) and is never
# edited, so it's out of scope for lint.
exclude = ["seed_fpa.py"]
