# planning_measure (8 rows)
# model_code is resolved to planning_model.model_id when loading.
- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: services_revenue
  aggregation_type: additive
  sql_expression: sumIf(amount_functional, account IN ('41000','41010','41020','41400'))
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: delivery_cost
  aggregation_type: additive
  sql_expression: sumIf(amount_functional, account IN ('51000','51050','51100','51300','51500'))
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: gross_margin
  aggregation_type: additive
  sql_expression: services_revenue - delivery_cost
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: utilisation
  aggregation_type: ratio
  sql_expression: billable_quantity / nullIf(delivery_quantity, 0)
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: realisation
  aggregation_type: ratio
  sql_expression: revenue_amount / nullIf(billable_quantity, 0)
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: gross_margin_pct
  aggregation_type: ratio
  sql_expression: gross_margin / nullIf(services_revenue, 0)
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: headcount
  aggregation_type: semi_additive
  sql_expression: uniq(resource_employee)
  available: true

- table: fpa_governance.planning_measure
  model_code: FPA-2026
  measure_code: open_pipeline
  aggregation_type: semi_additive
  sql_expression: '0'
  available: false

# plan_driver (6 rows)
# model_code is resolved to planning_model.model_id when loading.
- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: heads
  driver_name: Delivery heads
  formula: heads * (1 - attrition)
  effective_from: 2026-01-01
  unit: people
  value_type: count
  created_by: u-controller

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: available_hours
  driver_name: Available delivery hours
  formula: heads * 160
  effective_from: 2026-01-01
  unit: hours
  value_type: count
  created_by: u-controller

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: utilisation
  driver_name: Delivery utilisation
  formula: billable_hours / available_hours
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: u-controller

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: bill_rate
  driver_name: Blended bill rate
  formula: prior_period(bill_rate) * (1 + rate_increase)
  effective_from: 2026-01-01
  unit: USD/hour
  value_type: currency
  created_by: u-controller

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: realisation
  driver_name: Revenue realisation
  formula: bill_rate * realisation_factor
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
